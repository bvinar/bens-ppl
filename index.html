<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Ben's PPL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; overscroll-behavior-y: contain;}
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        input[type="checkbox"] {
            appearance: none;
            background-color: #1f2937;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.25em;
            height: 1.25em;
            border: 2px solid #4b5563;
            border-radius: 0.25em;
            display: grid;
            place-content: center;
        }
        input[type="checkbox"]::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #60a5fa;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        input[type="checkbox"]:checked::before { transform: scale(1); }
        input[type="checkbox"]:checked { border-color: #60a5fa; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const defaultWorkouts = {
            Pull: [
                { name: "Barbell Deadlift", weight: 135, sets: 3, reps: 5, increment: 10 },
                { name: "Seated Cable Row", weight: 75, sets: 3, reps: 10, increment: 5 },
                { name: "Lat Pulldown", weight: 85, sets: 3, reps: 12, increment: 5 },
                { name: "Reverse Pec Deck", weight: 25, sets: 3, reps: 15, increment: 5 },
                { name: "Seated EZ-Bar Curls", weight: 30, sets: 3, reps: 15, increment: 5 }
            ],
            Push: [
                { name: "Barbell Bench Press", weight: 95, sets: 3, reps: 5, increment: 5 },
                { name: "Seated DB Shoulder Press", weight: 25, sets: 3, reps: 10, increment: 5 },
                { name: "Incline DB Press", weight: 35, sets: 3, reps: 12, increment: 5 },
                { name: "Tricep Rope Pushdowns", weight: 30, sets: 3, reps: 15, increment: 5 },
                { name: "Dumbbell Lateral Raises", weight: 10, sets: 3, reps: 15, increment: 5 }
            ],
            Legs: [
                { name: "Machine Hack Squat", weight: 135, sets: 3, reps: 8, increment: 10 },
                { name: "Barbell RDL", weight: 95, sets: 3, reps: 10, increment: 10 },
                { name: "Seated Leg Curl", weight: 75, sets: 3, reps: 12, increment: 5 },
                { name: "Leg Extensions", weight: 70, sets: 3, reps: 15, increment: 5 },
                { name: "Standing Calf Raises", weight: 135, sets: 3, reps: 15, increment: 10 }
            ]
        };

        function App() {
            const [activeTab, setActiveTab] = useState('Home');
            
            const [targets, setTargets] = useState(() => {
                const saved = localStorage.getItem('bens-ppl-targets');
                return saved ? JSON.parse(saved) : defaultWorkouts;
            });

            const [logs, setLogs] = useState(() => {
                const saved = localStorage.getItem('bens-ppl-logs');
                return saved ? JSON.parse(saved) : {};
            });

            const [history, setHistory] = useState(() => {
                const saved = localStorage.getItem('bens-ppl-history');
                return saved ? JSON.parse(saved) : [];
            });

            const [selectedHistoryIds, setSelectedHistoryIds] = useState([]);
            const [editingHistoryId, setEditingHistoryId] = useState(null);
            const [editFormData, setEditFormData] = useState({});

            useEffect(() => { localStorage.setItem('bens-ppl-targets', JSON.stringify(targets)); }, [targets]);
            useEffect(() => { localStorage.setItem('bens-ppl-logs', JSON.stringify(logs)); }, [logs]);
            useEffect(() => { localStorage.setItem('bens-ppl-history', JSON.stringify(history)); }, [history]);

            const handleLogChange = (exercise, field, value) => {
                setLogs(prev => ({ ...prev, [exercise]: { ...prev[exercise], [field]: value } }));
            };

            const handleTargetChange = (day, index, field, value) => {
                const newTargets = { ...targets };
                newTargets[day][index][field] = value === '' ? '' : Number(value);
                setTargets(newTargets);
            };

            const updateNumSets = (exercise, delta, defaultSets) => {
                setLogs(prev => {
                    const current = prev[exercise] || {};
                    const currentNum = current.numSets !== undefined ? current.numSets : defaultSets;
                    const newNum = Math.max(1, currentNum + delta); 
                    return { ...prev, [exercise]: { ...current, numSets: newNum } };
                });
            };

            const finishWorkout = () => {
                if(!window.confirm(`Finish and save your ${activeTab} workout to History?`)) return;

                const completedExercises = [];
                targets[activeTab].forEach(ex => {
                    const exLogs = logs[ex.name] || {};
                    const loggedSets = [];
                    const currentNumSets = exLogs.numSets !== undefined ? exLogs.numSets : ex.sets;
                    
                    for(let i = 0; i < currentNumSets; i++) {
                        const r = exLogs[`rep_${i}`];
                        const w = exLogs[`weight_${i}`];
                        
                        if(r !== undefined && r !== '') {
                            // If weight is left blank, assume target weight
                            const finalWeight = (w !== undefined && w !== '') ? w : ex.weight;
                            loggedSets.push(`${finalWeight}x${r}`);
                        }
                    }

                    if (loggedSets.length > 0) {
                        completedExercises.push({
                            name: ex.name,
                            weight: ex.weight, // Target weight baseline
                            repsAchieved: loggedSets.join(', ')
                        });
                    }
                });

                if (completedExercises.length === 0) {
                    alert("No sets logged! Enter your reps before saving.");
                    return;
                }

                const newEntry = {
                    id: Date.now(),
                    date: new Date().toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }),
                    day: activeTab,
                    exercises: completedExercises
                };

                setHistory([newEntry, ...history]);
                const newLogs = { ...logs };
                targets[activeTab].forEach(ex => delete newLogs[ex.name]);
                setLogs(newLogs);
                
                setActiveTab("History");
            };

            const checkProgression = (ex) => {
                const exLogs = logs[ex.name] || {};
                const currentNumSets = exLogs.numSets !== undefined ? exLogs.numSets : ex.sets;
                
                if (currentNumSets < ex.sets) return <span className="text-orange-400 font-bold">Missed Volume Target (Hold {ex.weight} lbs)</span>;

                let allRepsMet = true;
                let setsLogged = 0;

                for (let i = 0; i < currentNumSets; i++) {
                    const repStr = exLogs[`rep_${i}`];
                    const weightStr = exLogs[`weight_${i}`];
                    
                    if (repStr === undefined || repStr === '') continue;
                    
                    const r = parseInt(repStr) || 0;
                    const w = (weightStr !== undefined && weightStr !== '') ? parseFloat(weightStr) : ex.weight;
                    
                    if (r < ex.reps || w < ex.weight) allRepsMet = false;
                    setsLogged++;
                }

                if (setsLogged === 0) return <span className="text-gray-400">Log your sets to see progression</span>;
                if (setsLogged < ex.sets) return <span className="text-gray-400">Finish {ex.sets} sets to progress</span>;
                if (allRepsMet) return <span className="text-green-400 font-bold">YES - Update Target to {ex.weight + ex.increment} lbs</span>;
                return <span className="text-gray-400">Hold {ex.weight} lbs</span>;
            };

            const toggleSelectAllHistory = () => {
                if (selectedHistoryIds.length === history.length) setSelectedHistoryIds([]);
                else setSelectedHistoryIds(history.map(h => h.id));
            };

            const toggleHistorySelection = (id) => {
                if (selectedHistoryIds.includes(id)) setSelectedHistoryIds(selectedHistoryIds.filter(x => x !== id));
                else setSelectedHistoryIds([...selectedHistoryIds, id]);
            };

            const deleteSelectedHistory = () => {
                if(window.confirm(`Delete ${selectedHistoryIds.length} workout(s) permanently?`)) {
                    setHistory(history.filter(h => !selectedHistoryIds.includes(h.id)));
                    setSelectedHistoryIds([]);
                }
            };

            const exportSelectedHistory = () => {
                const toExport = history.filter(h => selectedHistoryIds.includes(h.id));
                let csvContent = "Date,Day,Exercise,TargetWeight(lbs),SetsAchieved\n";
                toExport.forEach(entry => {
                    entry.exercises.forEach(ex => {
                        csvContent += `"${entry.date}","${entry.day}","${ex.name}","${ex.weight}","${ex.repsAchieved}"\n`;
                    });
                });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", "bens_ppl_workouts.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const startEdit = (entry) => {
                setEditingHistoryId(entry.id);
                setEditFormData(JSON.parse(JSON.stringify(entry)));
            };

            const handleEditFormChange = (field, value) => {
                setEditFormData(prev => ({ ...prev, [field]: value }));
            };

            const handleEditExerciseChange = (exIndex, field, value) => {
                const newForm = { ...editFormData };
                newForm.exercises[exIndex][field] = value;
                setEditFormData(newForm);
            };

            const saveEdit = () => {
                setHistory(history.map(h => h.id === editingHistoryId ? editFormData : h));
                setEditingHistoryId(null);
            };

            // --- VIEWS ---
            const renderHomeView = () => {
                const lastWorkout = history.length > 0 ? history[0] : null;
                const totalWorkouts = history.length;

                return (
                    <div className="space-y-6">
                        <div className="bg-gradient-to-r from-blue-900/40 to-gray-800 p-6 rounded-2xl border border-blue-500/30 shadow-xl">
                            <h2 className="text-2xl font-black text-white mb-1">Welcome back, Ben 💪</h2>
                            <p className="text-sm text-gray-300">Ready to crush today's session and keep the linear progression moving?</p>
                        </div>

                        <div className="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg">
                            <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Quick Launch Workout</h3>
                            <div className="grid grid-cols-3 gap-3">
                                <button onClick={() => setActiveTab('Pull')} className="bg-blue-600/20 border border-blue-500/40 hover:bg-blue-600/30 text-blue-400 py-3 rounded-xl font-bold text-sm transition-all shadow">Pull</button>
                                <button onClick={() => setActiveTab('Push')} className="bg-purple-600/20 border border-purple-500/40 hover:bg-purple-600/30 text-purple-400 py-3 rounded-xl font-bold text-sm transition-all shadow">Push</button>
                                <button onClick={() => setActiveTab('Legs')} className="bg-emerald-600/20 border border-emerald-500/40 hover:bg-emerald-600/30 text-emerald-400 py-3 rounded-xl font-bold text-sm transition-all shadow">Legs</button>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center shadow">
                                <div className="text-3xl font-black text-blue-400 mb-1">{totalWorkouts}</div>
                                <div className="text-xs font-bold text-gray-400 uppercase tracking-wider">Total Workouts</div>
                            </div>
                            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center shadow">
                                <div className="text-3xl font-black text-green-400 mb-1">{history.length > 0 ? history[0].day : 'None'}</div>
                                <div className="text-xs font-bold text-gray-400 uppercase tracking-wider">Last Session</div>
                            </div>
                        </div>

                        <div className="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg">
                            <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Last Logged Workout</h3>
                            {lastWorkout ? (
                                <div className="space-y-2">
                                    <div className="flex justify-between items-center text-sm border-b border-gray-700 pb-2 mb-2">
                                        <span className="font-bold text-blue-400">{lastWorkout.day} Day</span>
                                        <span className="text-xs text-gray-400 bg-gray-900 px-2 py-0.5 rounded">{lastWorkout.date}</span>
                                    </div>
                                    {lastWorkout.exercises.slice(0, 3).map((ex, i) => (
                                        <div key={i} className="flex justify-between text-xs text-gray-300">
                                            <span>{ex.name}</span>
                                            <span className="text-blue-300 font-bold">[{ex.repsAchieved}]</span>
                                        </div>
                                    ))}
                                    {lastWorkout.exercises.length > 3 && (
                                        <div className="text-center text-xs text-gray-500 pt-1">+ {lastWorkout.exercises.length - 3} more exercises...</div>
                                    )}
                                    <button onClick={() => setActiveTab('History')} className="w-full mt-3 text-xs font-bold text-blue-400 bg-gray-900/60 py-2 rounded border border-gray-700">View Full History</button>
                                </div>
                            ) : (
                                <div className="text-center text-gray-500 text-sm py-4">No workout history yet. Complete a session to see it featured here!</div>
                            )}
                        </div>
                    </div>
                );
            };

            const renderWorkoutView = () => (
                <div className="space-y-6">
                    {targets[activeTab].map((ex, idx) => {
                        const currentNumSets = logs[ex.name]?.numSets !== undefined ? logs[ex.name].numSets : ex.sets;
                        return (
                            <div key={idx} className="bg-gray-800 p-5 rounded-xl shadow-lg border border-gray-700">
                                <div className="flex justify-between items-start mb-4">
                                    <div>
                                        <h2 className="text-xl font-bold">{ex.name}</h2>
                                        <p className="text-sm text-gray-400 mt-1">Target: <span className="text-blue-300 font-bold">{ex.weight} lbs</span> for {ex.sets} sets of {ex.reps}</p>
                                    </div>
                                </div>

                                <div className="mb-4">
                                    <div className="flex justify-between text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 px-6">
                                        <span>Weight (lbs)</span>
                                        <span>Reps</span>
                                    </div>
                                    <div className="space-y-2">
                                        {Array.from({ length: currentNumSets }).map((_, setIdx) => (
                                            <div key={setIdx} className="flex items-center gap-2">
                                                <span className="text-gray-500 text-xs font-bold w-6 text-center">S{setIdx + 1}</span>
                                                <input 
                                                    type="number" 
                                                    placeholder={ex.weight}
                                                    className="flex-1 bg-gray-900 border border-gray-600 text-center text-white py-3 rounded-lg focus:outline-none focus:border-blue-500 font-bold text-lg" 
                                                    value={logs[ex.name]?.[`weight_${setIdx}`] || ''} 
                                                    onChange={(e) => handleLogChange(ex.name, `weight_${setIdx}`, e.target.value)} 
                                                />
                                                <span className="text-gray-500 font-bold">x</span>
                                                <input 
                                                    type="number" 
                                                    placeholder="Reps"
                                                    className="flex-1 bg-gray-900 border border-gray-600 text-center text-white py-3 rounded-lg focus:outline-none focus:border-blue-500 font-bold text-lg" 
                                                    value={logs[ex.name]?.[`rep_${setIdx}`] || ''} 
                                                    onChange={(e) => handleLogChange(ex.name, `rep_${setIdx}`, e.target.value)} 
                                                />
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex justify-between mt-3">
                                        <button onClick={() => updateNumSets(ex.name, -1, ex.sets)} className="text-xs font-bold text-red-400 bg-red-900/20 border border-red-900/30 px-3 py-2 rounded-lg">- Remove Set</button>
                                        <button onClick={() => updateNumSets(ex.name, 1, ex.sets)} className="text-xs font-bold text-blue-400 bg-blue-900/20 border border-blue-900/30 px-3 py-2 rounded-lg">+ Add Set</button>
                                    </div>
                                </div>
                                <div className="text-sm text-center bg-gray-900 py-3 rounded-lg mt-2 border border-gray-700">
                                    {checkProgression(ex)}
                                </div>
                            </div>
                        );
                    })}
                    <button onClick={finishWorkout} className="w-full mt-8 py-4 bg-green-900/20 text-green-400 border border-green-900/50 rounded-lg font-bold text-lg transition-colors active:bg-green-900/40 shadow-lg">Finish & Save {activeTab} Workout</button>
                </div>
            );

            const renderTargetsView = () => (
                <div className="space-y-8">
                    <p className="text-sm text-gray-400 text-center px-4">Update your baseline targets here when you progress.</p>
                    {['Pull', 'Push', 'Legs'].map(day => (
                        <div key={day} className="bg-gray-800 p-4 rounded-xl border border-gray-700">
                            <h2 className="text-xl font-bold text-blue-400 mb-4">{day} Targets</h2>
                            <div className="space-y-3">
                                <div className="flex text-xs font-bold text-gray-500 uppercase tracking-wider px-2">
                                    <div className="w-5/12">Exercise</div>
                                    <div className="w-7/12 flex justify-between text-center gap-1">
                                        <div className="w-1/3">Lbs</div>
                                        <div className="w-1/3">Sets</div>
                                        <div className="w-1/3">Reps</div>
                                    </div>
                                </div>
                                {targets[day].map((ex, idx) => (
                                    <div key={idx} className="flex items-center justify-between bg-gray-900 p-2 rounded-lg border border-gray-700">
                                        <div className="w-5/12 text-sm font-bold pr-2 leading-tight">{ex.name}</div>
                                        <div className="w-7/12 flex gap-2">
                                            <input type="number" className="w-1/3 bg-gray-800 border border-gray-600 rounded p-2 text-center font-bold text-white focus:border-blue-500" value={ex.weight} onChange={(e) => handleTargetChange(day, idx, 'weight', e.target.value)} />
                                            <input type="number" className="w-1/3 bg-gray-800 border border-gray-600 rounded p-2 text-center font-bold text-white focus:border-blue-500" value={ex.sets} onChange={(e) => handleTargetChange(day, idx, 'sets', e.target.value)} />
                                            <input type="number" className="w-1/3 bg-gray-800 border border-gray-600 rounded p-2 text-center font-bold text-white focus:border-blue-500" value={ex.reps} onChange={(e) => handleTargetChange(day, idx, 'reps', e.target.value)} />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ))}
                </div>
            );

            const renderHistoryView = () => (
                <div className="space-y-4">
                    {history.length > 0 && (
                        <div className="flex justify-between items-center bg-gray-800 p-3 rounded-lg border border-gray-700">
                            <label className="flex items-center gap-3 cursor-pointer">
                                <input type="checkbox" checked={selectedHistoryIds.length === history.length} onChange={toggleSelectAllHistory} />
                                <span className="text-sm font-bold text-gray-300">Select All</span>
                            </label>
                            {selectedHistoryIds.length > 0 && (
                                <div className="flex gap-2">
                                    <button onClick={exportSelectedHistory} className="bg-blue-600/30 text-blue-400 border border-blue-600/50 px-3 py-1.5 rounded text-sm font-bold active:bg-blue-600/50">Export CSV</button>
                                    <button onClick={deleteSelectedHistory} className="bg-red-600/30 text-red-400 border border-red-600/50 px-3 py-1.5 rounded text-sm font-bold active:bg-red-600/50">Delete</button>
                                </div>
                            )}
                        </div>
                    )}
                    
                    {history.length === 0 ? (
                        <div className="text-center text-gray-500 py-10">No workouts saved yet.</div>
                    ) : (
                        history.map(entry => {
                            const isEditing = editingHistoryId === entry.id;
                            const isSelected = selectedHistoryIds.includes(entry.id);
                            
                            if (isEditing) {
                                return (
                                    <div key={entry.id} className="bg-gray-800 p-4 rounded-xl border border-blue-500 shadow-lg relative">
                                        <div className="flex justify-between mb-4">
                                            <input type="text" className="bg-gray-900 border border-gray-600 p-2 rounded text-white font-bold w-32" value={editFormData.date} onChange={(e) => handleEditFormChange('date', e.target.value)} />
                                            <span className="text-blue-400 font-bold px-2 py-1">{editFormData.day} Day</span>
                                        </div>
                                        <div className="flex text-xs font-bold text-gray-500 uppercase tracking-wider px-1 mb-2">
                                            <div className="w-5/12">Exercise</div>
                                            <div className="w-7/12 text-center">Sets (Lbs x Reps)</div>
                                        </div>
                                        <div className="space-y-2 mb-4">
                                            {editFormData.exercises.map((ex, i) => (
                                                <div key={i} className="flex gap-2 items-center text-sm">
                                                    <div className="w-5/12 font-bold text-gray-300 leading-tight">{ex.name}</div>
                                                    <input type="text" className="w-7/12 bg-gray-900 border border-gray-600 rounded p-2 text-center font-bold text-white focus:border-blue-500" value={ex.repsAchieved} onChange={(e) => handleEditExerciseChange(i, 'repsAchieved', e.target.value)} />
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex justify-end gap-2">
                                            <button onClick={() => setEditingHistoryId(null)} className="px-4 py-2 rounded font-bold text-gray-400 bg-gray-700">Cancel</button>
                                            <button onClick={saveEdit} className="px-4 py-2 rounded font-bold text-white bg-blue-600">Save Changes</button>
                                        </div>
                                    </div>
                                );
                            }

                            return (
                                <div key={entry.id} className={`bg-gray-800 p-4 rounded-xl border ${isSelected ? 'border-blue-500' : 'border-gray-700'} shadow-lg transition-colors`}>
                                    <div className="flex items-center gap-3 mb-3 border-b border-gray-700 pb-3">
                                        <input type="checkbox" checked={isSelected} onChange={() => toggleHistorySelection(entry.id)} />
                                        <div className="flex-1 flex justify-between items-center">
                                            <h3 className="font-bold text-lg text-blue-400">{entry.day} Day</h3>
                                            <span className="text-sm font-semibold text-gray-400 bg-gray-900 px-2 py-1 rounded">{entry.date}</span>
                                        </div>
                                    </div>
                                    <div className="space-y-2 mb-4">
                                        {entry.exercises.map((ex, i) => (
                                            <div key={i} className="flex justify-between text-sm items-center">
                                                <span className="font-bold text-gray-200">{ex.name}</span>
                                                <span className="text-blue-300 font-bold bg-gray-900 px-2 py-0.5 rounded tracking-wide">[{ex.repsAchieved}]</span>
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => startEdit(entry)} className="w-full text-xs font-bold text-gray-400 bg-gray-900/50 border border-gray-700 py-2 rounded hover:bg-gray-700 transition-colors">
                                        Edit Workout
                                    </button>
                                </div>
                            );
                        })
                    )}
                </div>
            );

            return (
                <div className="max-w-md mx-auto p-4 pb-12">
                    <h1 className="text-3xl font-bold mb-4 text-center text-blue-400">Ben's PPL</h1>
                    <div className="flex overflow-x-auto hide-scrollbar gap-2 mb-6 bg-gray-800 rounded-lg p-1">
                        {['Home', 'Pull', 'Push', 'Legs', 'Targets', 'History'].map(tab => (
                            <button key={tab} onClick={() => setActiveTab(tab)} className={`flex-none px-4 py-3 text-sm font-bold rounded-md transition-colors ${activeTab === tab ? 'bg-blue-600 text-white' : 'text-gray-400'}`}>
                                {tab}
                            </button>
                        ))}
                    </div>
                    {activeTab === 'Home' ? renderHomeView() : activeTab === 'History' ? renderHistoryView() : activeTab === 'Targets' ? renderTargetsView() : renderWorkoutView()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
